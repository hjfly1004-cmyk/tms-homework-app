<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3F5BC4">
<title>마음 연습 과제 수첩</title>

<!-- 홈 화면에 설치해서 앱처럼 쓰기 위한 것들.
     홈 화면 이름은 manifest의 short_name('마음 연습')이다. 남의 눈에도 보이는 글자라
     프로그램 이름에서 '우울'을 뺐다. -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="마음 연습">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- 검색 결과에 올라가지 않게 한다 -->
<meta name="robots" content="noindex, nofollow">

<!-- 카톡 미리보기 카드. 주소가 절대주소인 이유: 카톡 서버가 밖에서 읽어간다 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="마음 연습">
<meta property="og:title" content="마음 연습">
<meta property="og:description" content="기분을 돕는 작은 행동과, 지금 이 순간을 알아차리는 연습을 집에서 이어 가요.">
<meta property="og:url" content="https://hjfly1004-cmyk.github.io/tms-homework-app/">
<meta property="og:image" content="https://hjfly1004-cmyk.github.io/tms-homework-app/icons/icon-512.png">
<style>
  /* 색은 센터 화면의 프로그램(우울을 다루는 마음 연습)과 같다.
     글꼴은 밖에서 받아오지 않는다. 인터넷이 없어도 열려야 한다. */
  :root{
    --bg:#F5F6F8; --card:#ffffff; --ink:#2B2F3A; --sub:#636A78; --faint:#8A909C; --line:#E2E5EB;
    --slate:#3E4458; --pale:#EEF2FB; --paleink:#34489A;
    --g1:#3F5BC4; --g2:#7558C8;
    --warnbg:#FDF1F0; --warnink:#B2463F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);
       font-size:16.5px;line-height:1.65;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}
  button,input,textarea,select{font-family:inherit;font-size:16px;color:inherit;letter-spacing:inherit}
  button{cursor:pointer;-webkit-tap-highlight-color:transparent}
  a{color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(36px + env(safe-area-inset-bottom))}

  .hero{background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff;border-radius:16px;padding:22px 20px;margin-bottom:14px}
  .hero small{display:block;font-size:13px;opacity:.9}
  .hero h1{font-size:24px;line-height:1.35;margin:6px 0 2px;font-weight:800}
  .hero .name{font-size:17px;font-weight:700;opacity:.95}
  .hero p{font-size:14.5px;margin-top:8px;opacity:.95}

  .top{position:sticky;top:0;z-index:20;background:var(--bg);margin:-16px -16px 12px;padding:10px 16px;
       border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .top a{flex:none;font-size:14.5px;font-weight:700;color:var(--paleink);text-decoration:none;padding:6px 2px}
  .top b{font-size:14.5px;color:var(--sub);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .page-title small{display:block;color:var(--paleink);font-weight:700;font-size:14px}
  .page-title h1{font-size:22px;line-height:1.35;font-weight:800}
  .page-title p{font-size:14.5px;color:var(--sub);margin:2px 0 12px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
  .card.soft{background:var(--pale);border-color:#DCE3F4;color:#3B4A7A}
  .card.warn{background:var(--warnbg);border-color:#F3D3CF;color:var(--warnink);font-size:15px}
  .card.warn a{font-weight:800}
  .card h2{font-size:17px;line-height:1.4;font-weight:800;margin-bottom:8px}
  .card h3{font-size:15px;font-weight:700;margin:14px 0 6px;color:var(--slate)}
  .card h2 + h3{margin-top:4px}
  .hint{font-size:14px;color:var(--sub)}
  .note{font-size:14.5px;color:var(--sub);margin-top:10px}
  ul.plain,ol.plain{padding-left:20px}
  ul.plain li,ol.plain li{margin:4px 0}
  ol.steps{list-style:none;counter-reset:s}
  ol.steps li{counter-increment:s;position:relative;padding-left:32px;margin:9px 0}
  ol.steps li:before{content:counter(s);position:absolute;left:0;top:1px;width:23px;height:23px;border-radius:7px;background:var(--slate);
    color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}

  .list a{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin:9px 0;text-decoration:none}
  .list .n{flex:none;width:34px;height:34px;border-radius:9px;background:var(--slate);color:#fff;font-weight:800;
    display:flex;align-items:center;justify-content:center}
  .list .t{min-width:0;flex:1;font-weight:700;line-height:1.4}
  .list .t small{display:block;font-weight:500;font-size:13.5px;color:var(--sub)}
  .list .go{flex:none;color:var(--faint)}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{min-height:40px;padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:14.5px;line-height:1.35;text-align:left}
  .chip.on{background:var(--g1);border-color:var(--g1);color:#fff;font-weight:700}
  .add{display:flex;gap:7px;margin-top:9px}
  .add input{flex:1;min-width:0}
  .add button{flex:none;padding:0 15px;border:none;border-radius:10px;background:var(--slate);color:#fff;font-size:14.5px;font-weight:700}

  input[type=text],input[type=date],input[type=number],textarea,select{
    width:100%;min-width:0;min-height:44px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;
    -webkit-appearance:none;appearance:none}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--g1)}
  textarea{min-height:190px;line-height:1.6;resize:vertical}
  .field{margin:10px 0}
  .field label,.lab{display:block;font-size:14px;font-weight:700;color:var(--slate);margin-bottom:4px}

  details.day{background:#fff;border:1px solid var(--line);border-radius:12px;margin:8px 0}
  details.day.today{border-color:var(--g1)}
  details.day summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:700;cursor:pointer}
  details.day summary::-webkit-details-marker{display:none}
  details.day summary .d{font-weight:500;color:var(--sub);font-size:14.5px}
  details.day summary .tag{font-size:12px;font-weight:700;color:#fff;background:var(--g1);border-radius:6px;padding:1px 7px}
  details.day summary .mark{margin-left:auto;font-size:13px;font-weight:600;color:var(--paleink)}
  details.day summary:after{content:'▾';color:var(--faint)}
  details.day[open] summary:after{content:'▴'}
  details.day .in{padding:0 14px 14px}

  .slot{border-top:1px solid var(--line);padding:10px 0}
  .slot:first-child{border-top:none;padding-top:0}
  .slot .row{display:grid;grid-template-columns:1fr 84px 44px;gap:7px;margin-top:6px}
  .star{min-height:44px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:20px;color:var(--faint);line-height:1}
  .star.on{border-color:#E0A82E;color:#D0951A;background:#FFF8E6}
  .ticks{display:flex;flex-wrap:wrap;gap:7px}
  .tick{min-height:44px;padding:7px 13px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:14.5px;display:flex;align-items:center;gap:7px}
  .tick:before{content:'';width:18px;height:18px;border-radius:5px;border:1.5px solid var(--faint);flex:none}
  .tick.on{border-color:var(--g1);background:var(--pale);color:var(--paleink);font-weight:700}
  .tick.on:before{background:var(--g1);border-color:var(--g1);box-shadow:inset 0 0 0 3px #fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}

  .kv{border-top:1px solid var(--line);padding:9px 0}
  .kv:first-of-type{border-top:none}
  .kv b{display:block}
  .kv span{display:block;font-size:14.5px;color:var(--sub)}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:15px}
  .pair b{color:var(--paleink)}
  .pager{display:flex;gap:8px;margin-top:14px}
  .pager a{flex:1;text-align:center;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14.5px;text-decoration:none}

  /* 마음챙김 그림은 뒤쪽 모음이 아니라 그 과제 바로 아래에 둔다 */
  .figs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;text-align:center}
  .figs figure,.fig1{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
  .figs img{display:block;width:100%;height:auto}
  .figs figcaption{font-size:14px;line-height:1.4;font-weight:700;color:var(--paleink);margin-top:4px}
  .figs figcaption span{display:block;font-weight:500;color:var(--sub)}
  .fig1{display:block;margin:10px auto;text-align:center}
  .fig1 img{display:block;height:300px;width:auto;margin:0 auto}
  .fig1 svg{display:block;width:100%;height:auto}
  .hs{fill:#E4E9F5;stroke:#5A6179;stroke-width:2}
  .ht{font-size:20px;fill:var(--ink)} .ht .hn{font-size:23px;font-weight:800}

  .savefail{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;background:var(--warnink);color:#fff;
    border-radius:12px;padding:12px 14px;font-size:14.5px;font-weight:700}

  /* 설치 안내 */
  .install-bar{display:none;background:#fff;border:1.5px solid #DCE3F4;border-radius:14px;padding:14px 15px;margin:12px 0;text-align:center}
  .install-bar.show{display:block}
  .install-bar p{font-size:14px;line-height:1.65;color:var(--sub);margin-bottom:10px;white-space:pre-line}
  .install-bar .row{display:flex;gap:8px;justify-content:center}
  .install-bar button{padding:10px 15px;border-radius:10px;border:none;font-size:14px;font-weight:700;background:var(--g1);color:#fff}
  .install-bar button.ghost{background:#fff;color:var(--sub);border:1.5px solid var(--line)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="savefail" id="saveFail" hidden>저장하지 못했습니다. 휴대폰 저장 공간을 확인해 주세요.</div>

<script>
'use strict';

/* ===== 저장 =====
   적은 것은 이 휴대폰(localStorage)에만 남는다. 밖으로 보내지 않는다.
   센터 PC의 프로그램이 쓰는 tms_dep5_feedback_v1과 다른 키다. */
const KEY = 'tms_homework_v1';

function emptyData(){ return { schemaVersion:1, p:{ 1:{}, 2:{}, 3:{}, 4:{}, 5:{} }, memo:'' }; }

function loadData(){
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if(saved && typeof saved === 'object') return Object.assign(emptyData(), saved);
  } catch(e){}
  return emptyData();
}
let D = loadData();

function saveData(){
  const bar = document.getElementById('saveFail');
  try { localStorage.setItem(KEY, JSON.stringify(D)); bar.hidden = true; }
  catch(e){ bar.hidden = false; }   // 조용히 넘어가면 적은 것이 사라진 줄 모른다
}

// 경로 하나로 읽고 쓴다. 예: p.2.log.0.joy
function getv(path){
  return path.split('.').reduce(function(o, k){ return (o === undefined || o === null) ? undefined : o[k]; }, D);
}
function setv(path, val){
  const ks = path.split('.');
  let o = D;
  ks.slice(0, -1).forEach(function(k){
    if(!o[k] || typeof o[k] !== 'object') o[k] = {};
    o = o[k];
  });
  o[ks[ks.length - 1]] = val;

  // 첫 기록을 적는 날이 그 주의 시작이다. 쪽을 넘겨 보기만 했다고 날짜가 박히면 안 된다
  const m = /^p\.(\d)\.log\./.exec(path);
  if(m && !D.p[m[1]].start) D.p[m[1]].start = today();
  saveData();
}

/* ===== 날짜 ===== */
function fmt(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function today(){ return fmt(new Date()); }
function dayAt(start, i){
  const p = start.split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2] + i);
}
const WEEKDAY = ['일','월','화','수','목','금','토'];

/* ===== 글자 ===== */
function esc(s){
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

/* ===== 수첩 내용 (과제 수첩 PDF와 센터 프로그램에서 그대로 옮김) ===== */
const ACT_PLEASANT = ['산책하기','좋아하는 음악 듣기','햇볕 쬐기','따뜻한 샤워·목욕','좋아하는 음식 먹기','차·커피 천천히 마시기',
  '영상·드라마 보기','친구·가족과 통화','누군가와 밥 먹기','책·웹툰 보기','스트레칭·가벼운 운동','반려동물·식물 돌보기'];
const ACT_MASTERY = ['책상 위 정리','설거지','빨래 개기','쓰레기 버리기','장보기','간단한 요리',
  '미뤄 둔 연락 하나 하기','서류·공과금 하나 처리','일·공부 10분','일기 쓰기','하루 계획 세우기','운동 10분'];
const DAYS = ['월','화','수','목','금','토','일'];
const TIMES = ['아침','점심','오후','저녁','자기 전'];

const PRACTICES = [
  { n:1, title:'내 기분과 하루 살펴보기', sub:'기분과 활동의 연결 · 세 가지 감각 알아차리기' },
  { n:2, title:'기분에 도움이 되는 활동 찾기', sub:'즐거움과 성취감을 주는 활동 · 마음챙김 호흡' },
  { n:3, title:'작게 시작하고, 어려움에 대비하기', sub:'작은 단계 만들기 · 앉아서 몸의 감각 살펴보기' },
  { n:4, title:'반복되는 생각 알아차리기', sub:'2분 규칙 · 3분 마음챙김 명상' },
  { n:5, title:'힘들 때 꺼내 보는 나만의 카드', sub:'대처 카드 만들기 · 생각과 거리 두기' }
];

/* ===== 칸 만들기 ===== */
function chips(path, base, opt){
  opt = opt || {};
  const cur = getv(path);
  const chosen = opt.single ? (cur ? [cur] : []) : (Array.isArray(cur) ? cur : []);
  // 기본 목록에 없는 것도 보여준다. 직접 적은 것이나 나중에 목록에서 뺀 항목이
  // 화면에서 사라지면 본인이 지울 수 없게 된다
  const shown = opt.only ? base : base.concat(chosen.filter(function(v){ return base.indexOf(v) < 0; }));
  const html = shown.map(function(v){
    const on = chosen.indexOf(v) >= 0;
    return '<button type="button" class="chip' + (on ? ' on' : '') + '" aria-pressed="' + on + '" data-chip="' + path + '"' +
      (opt.single ? ' data-single="1"' : '') + ' data-v="' + esc(v) + '">' + esc(v) + '</button>';
  }).join('');
  const add = opt.add
    ? '<div class="add"><input type="text" maxlength="40" placeholder="직접 적기" aria-label="직접 적기" data-addin="' + path + '">' +
      '<button type="button" data-add="' + path + '">추가</button></div>'
    : '';
  return '<div class="chips">' + html + '</div>' + add;
}
// 묶음이 나뉜 목록. 어느 묶음에도 없는 것(직접 적은 것)은 맨 아래에 한 번만 보여준다
function groupChips(path, groups){
  const all = [].concat.apply([], groups.map(function(g){ return g[1]; }));
  const cur = getv(path);
  const extra = (Array.isArray(cur) ? cur : []).filter(function(v){ return all.indexOf(v) < 0; });
  return groups.map(function(g){ return '<h3>' + esc(g[0]) + '</h3>' + chips(path, g[1], { only:true }); }).join('') +
    '<div style="margin-top:9px">' + chips(path, extra, { only:true, add:true }) + '</div>';
}
function text(path, label, ph){
  return '<div class="field">' + (label ? '<label>' + esc(label) + '</label>' : '') +
    '<input type="text" maxlength="120" aria-label="' + esc(label || ph || '') + '" placeholder="' + esc(ph || '') + '" data-path="' + path + '" value="' + esc(getv(path)) + '"></div>';
}
function scoreSelect(path, label){
  const cur = getv(path);
  let o = '<option value="">' + '점수' + '</option>';
  for(let i = 0; i <= 10; i++){
    o += '<option value="' + i + '"' + (String(cur) === String(i) ? ' selected' : '') + '>' + i + '점</option>';
  }
  return '<select aria-label="' + esc(label) + ' 점수 (0~10)" data-path="' + path + '">' + o + '</select>';
}
function score(path, label){
  return '<div class="field"><label>' + esc(label) + ' (0~10)</label>' + scoreSelect(path, label) + '</div>';
}
function tick(path, label){
  const on = !!getv(path);
  return '<button type="button" class="tick' + (on ? ' on' : '') + '" aria-pressed="' + on + '" data-tog="' + path + '">' + esc(label) + '</button>';
}
function checkDate(n){
  return '<div class="card"><div class="field" style="margin:0"><label>담당 선생님 확인</label>' +
    '<input type="date" aria-label="담당 선생님 확인 날짜" data-path="p.' + n + '.checked" value="' + esc(getv('p.' + n + '.checked')) + '"></div></div>';
}
function whenFields(n){
  return '<h3>요일</h3>' + chips('p.' + n + '.days', DAYS) + '<h3>때</h3>' + chips('p.' + n + '.times', TIMES);
}

function hasContent(v){
  if(Array.isArray(v)) return v.length > 0;
  if(v && typeof v === 'object') return Object.keys(v).some(function(k){ return hasContent(v[k]); });
  return v === 0 || !!v;
}

// 일주일 칸. 종이의 월~일 대신 시작한 날부터 7일로 둔다.
// TMS 다음 날부터 바로 적게 되는데 월요일로 고정하면 지난 요일 칸이 비어 버린다
function week(n, title, dayFn, foot){
  const saved = getv('p.' + n + '.start');
  const start = saved || today();
  const now = today();
  let openAt = 0;
  for(let i = 0; i < 7; i++){ if(fmt(dayAt(start, i)) === now) openAt = i; }

  let rows = '';
  for(let i = 0; i < 7; i++){
    const d = dayAt(start, i);
    const isToday = fmt(d) === now;
    const filled = hasContent(getv('p.' + n + '.log.' + i));
    rows += '<details class="day' + (isToday ? ' today' : '') + '" data-day="' + n + '.' + i + '"' + (i === openAt ? ' open' : '') + '>' +
      '<summary>' + WEEKDAY[d.getDay()] + ' <span class="d">' + (d.getMonth() + 1) + '/' + d.getDate() + '</span>' +
      (isToday ? '<span class="tag">오늘</span>' : '') +
      '<span class="mark">' + (filled ? '적음' : '') + '</span></summary>' +
      '<div class="in">' + dayFn('p.' + n + '.log.' + i) + '</div></details>';
  }
  return '<div class="card"><h2>' + esc(title) + '</h2>' +

        '<p class="note">하는 방법은 <a href="#p1">연습 1</a> 감각 1분, <a href="#p2">연습 2</a> 호흡, <a href="#p3">연습 3</a> 바디스캔, <a href="#p4">연습 4</a> 3분 명상에 있어요.</p></div>' +
      '<div class="card"><h2>이번 주 과제</h2><ul class="plain">' +
        '<li>이 화면의 대처 카드를 <b>휴대폰으로 찍어</b> 저장해 두기</li>' +
        '<li>고른 연습을 <b>하루 한 번</b> 이어 가기 (정해 둔 시간에 알람을 맞춰 두면 좋아요)</li></ul></div>' +
      week(5, '일주일 기록', function(b){
        return '<div class="lab">고른 연습</div>' +
          (keep.length ? chips(b + '.done', keep, { only:true }) : '<p class="hint">위에서 이어 갈 연습을 고르면 여기에 나와요.</p>') +
          score(b + '.mood', '기분') + text(b + '.note', '메모', '');
      }) + checkDate(5);
  }
};

/* ===== 화면 ===== */
const FOOT = '<div class="card warn"><b>기분이 많이 힘들 때는 혼자 견디지 말고 병원에 연락하세요.</b></div>' +
  '<p class="hint" style="text-align:center">이 수첩과 마음 연습은 치료를 대신하지 않아요.<br>힘든 점은 담당 선생님께 말씀해 주세요.</p>';

function homeHTML(){
  return '<div class="hero"><small>YD 인지행동치료 프로그램</small><h1>우울을 다루는 마음 연습</h1><div class="name">과제 수첩</div>' +
      '<p>기분을 돕는 작은 행동과, 지금 이 순간을 알아차리는 연습을 집에서 이어 가요.</p></div>' +
    '<div class="install-bar" id="installBar"><p id="installText"></p><div class="row">' +
      '<button type="button" id="installAction">홈 화면에 설치</button><button type="button" class="ghost" id="installClose">나중에</button></div></div>' +
    '<div class="list">' + PRACTICES.map(function(p){
      const s = getv('p.' + p.n + '.start');
      return '<a href="#p' + p.n + '"><span class="n">' + p.n + '</span><span class="t">' + esc(p.title) +
        '<small>' + (s ? (Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10)) + ' 시작') : esc(p.sub)) + '</small></span><span class="go">›</span></a>';
    }).join('') +
    '<a href="#memo"><span class="n">✎</span><span class="t">메모<small>진료 때 이야기하고 싶은 것</small></span><span class="go">›</span></a></div>' +
    '<div class="card"><h2>이렇게 써요</h2><ol class="steps">' +
      "<li><b>TMS가 끝나기 전에</b> 화면의 '오늘의 카드'를 휴대폰으로 찍어 두세요.</li>" +
      '<li>집에서 사진을 보며, 이 수첩의 <b>해당 연습</b>에서 고른 것을 <b>눌러</b> 주세요.</li>' +
      '<li>일주일 동안 <b>체크표</b>에 했는지 표시해요. 못 한 날이 있어도 괜찮아요.</li>' +
      '<li>다음 진료 때 이 수첩을 <b>휴대폰으로 보여 주세요.</b> 담당 선생님이 과제를 함께 확인해요.</li></ol>' +
      '<p class="note">적은 내용은 이 휴대폰에만 저장돼요.</p></div>' +
    "<div class=\"card soft\"><h2>다음 TMS 치료 때</h2><p>화면 첫 페이지에서 지난번 카드에 안내된 <b>'다음 연습'</b>을 고르면 돼요. (오늘의 카드에 '다음 시간'이 적혀 있어요)</p></div>" + FOOT;
}

function practiceHTML(n){
  const p = PRACTICES[n - 1];
  const prev = n > 1 ? '<a href="#p' + (n - 1) + '">← 연습 ' + (n - 1) + '</a>' : '';
  const next = n < 5 ? '<a href="#p' + (n + 1) + '">연습 ' + (n + 1) + ' →</a>' : '';
  return '<div class="top"><a href="#">← 처음으로</a><b>연습 ' + n + '</b></div>' +
    '<div class="page-title"><small>연습 ' + n + '</small><h1>' + esc(p.title) + '</h1><p>' + esc(p.sub) + '</p></div>' +
    PAGES[n]() + '<div class="pager">' + prev + next + '</div><div style="height:12px"></div>' + FOOT;
}

function memoHTML(){
  return '<div class="top"><a href="#">← 처음으로</a><b>메모</b></div>' +
    '<div class="page-title"><h1>메모</h1><p>진료 때 이야기하고 싶은 것</p></div>' +
    '<div class="card"><textarea aria-label="메모" data-path="memo">' + esc(D.memo) + '</textarea></div>' + FOOT;
}

const app = document.getElementById('app');

function route(){
  const h = location.hash.replace('#', '');
  const m = /^p([1-5])$/.exec(h);
  app.innerHTML = m ? practiceHTML(Number(m[1])) : (h === 'memo' ? memoHTML() : homeHTML());
  updateInstallBar();
}
window.addEventListener('hashchange', function(){ route(); window.scrollTo(0, 0); });

// 고른 것이 다른 칸에 이어지므로 다시 그린다. 보던 자리와 펼친 날은 그대로 둔다
function rerender(){
  const y = window.scrollY;
  const open = {};
  app.querySelectorAll('details.day').forEach(function(d){ open[d.dataset.day] = d.open; });
  route();
  app.querySelectorAll('details.day').forEach(function(d){
    if(open[d.dataset.day] !== undefined) d.open = open[d.dataset.day];
  });
  window.scrollTo(0, y);
}

function addValue(path){
  const box = app.querySelector('[data-addin="' + path + '"]');
  const v = box ? box.value.trim() : '';
  if(!v) return;
  const arr = Array.isArray(getv(path)) ? getv(path).slice() : [];
  if(arr.indexOf(v) < 0) arr.push(v);
  setv(path, arr);
  rerender();
}

document.addEventListener('click', function(e){
  const t = e.target.closest('[data-chip],[data-tog],[data-add],[data-fill]');
  if(!t) return;
  if(t.dataset.add){ addValue(t.dataset.add); return; }
  if(t.dataset.fill){ setv(t.dataset.fill, t.dataset.v); rerender(); return; }
  if(t.dataset.tog){ setv(t.dataset.tog, !getv(t.dataset.tog)); rerender(); return; }

  const path = t.dataset.chip, v = t.dataset.v;
  if(t.dataset.single){
    setv(path, getv(path) === v ? '' : v);
  } else {
    const arr = Array.isArray(getv(path)) ? getv(path).slice() : [];
    const i = arr.indexOf(v);
    if(i >= 0) arr.splice(i, 1); else arr.push(v);
    setv(path, arr);
  }
  rerender();
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && e.target.dataset && e.target.dataset.addin){ e.preventDefault(); addValue(e.target.dataset.addin); }
});

function onField(e){
  const el = e.target;
  if(!el.dataset || !el.dataset.path) return;
  setv(el.dataset.path, el.value);
  const day = el.closest('details.day');
  if(day){
    const k = day.dataset.day.split('.');
    day.querySelector('.mark').textContent = hasContent(getv('p.' + k[0] + '.log.' + k[1])) ? '적음' : '';
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', function(e){
  const el = e.target;
  if(el.dataset && el.dataset.start){
    D.p[el.dataset.start].start = el.value;
    saveData();
    rerender();
  }
});

/* ===== 홈 화면에 설치하기 =====
   반디·수면일기와 같은 방식이다. 카톡 안의 브라우저에서는 설치가 안 되므로
   밖으로 나가라고 먼저 알린다. */
const INSTALL_HINT_KEY = 'tms_homework_install_hint';
let deferredInstall = null;

window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredInstall = e; updateInstallBar(); });
window.addEventListener('appinstalled', function(){ deferredInstall = null; updateInstallBar(); });

function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
function inAppBrowser(){ return /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|FB_IAB|Line\/|DaumApps/i.test(navigator.userAgent); }
function isKakao(){ return /KAKAOTALK/i.test(navigator.userAgent); }

function updateInstallBar(){
  const bar = document.getElementById('installBar');
  if(!bar) return;                       // 첫 화면에만 있다
  const text = document.getElementById('installText');
  const action = document.getElementById('installAction');
  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPad|iPhone|iPod/i.test(ua);

  bar.classList.remove('show');
  if(isStandalone()) return;

  if(inAppBrowser()){
    const where = isKakao() ? '카톡' : '앱';
    text.textContent = isAndroid
      ? '지금은 ' + where + ' 안의 브라우저로 열려 있어요.\n크롬으로 열어야 홈 화면에 둘 수 있어요.'
      : '지금은 ' + where + ' 안의 브라우저로 열려 있어요.\n오른쪽 아래 버튼을 눌러 사파리로 열어주세요.';
    action.textContent = '크롬으로 열기';
    action.style.display = isAndroid ? '' : 'none';
    bar.classList.add('show');
    return;
  }

  // 앱 안 브라우저 안내는 늘 띄우지만, 설치 권유는 한 번 닫으면 그만 띄운다
  try { if(localStorage.getItem(INSTALL_HINT_KEY) === 'off') return; } catch(e){ return; }

  if(deferredInstall){
    text.textContent = '홈 화면에 두면 인터넷이 없어도 열려요.';
    action.textContent = '홈 화면에 설치';
    action.style.display = '';
    bar.classList.add('show');
    return;
  }
  if(isIOS){
    // 아이폰은 사파리와 홈 화면 앱의 저장 공간이 따로일 수 있다(확인 못 함). 그래서 순서를 알려준다
    text.textContent = '홈 화면에 두면 인터넷이 없어도 열려요.\n아래 공유 버튼을 눌러 "홈 화면에 추가"를 골라주세요.\n기록은 홈 화면 아이콘으로 연 다음에 시작해주세요.';
    action.style.display = 'none';
    bar.classList.add('show');
  }
}

document.addEventListener('click', function(e){
  if(e.target.id === 'installAction'){
    if(inAppBrowser()){
      const bare = location.href.replace(/^https?:\/\//, '');
      location.href = 'intent://' + bare + '#Intent;scheme=https;package=com.android.chrome;end';
      return;
    }
    if(!deferredInstall) return;
    deferredInstall.prompt();
    deferredInstall.userChoice.then(function(){ deferredInstall = null; updateInstallBar(); });
  }
  if(e.target.id === 'installClose'){
    if(!inAppBrowser()){ try { localStorage.setItem(INSTALL_HINT_KEY, 'off'); } catch(err){} }
    document.getElementById('installBar').classList.remove('show');
  }
});

route();

if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
